<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2 class="logo">Vivek</h2>
      <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <button id="themeToggle">🌙</button>
      </nav>
    </header>

    <section id="about">
      <h1>Hi, I'm Vivek</h1>
      <p>BTech CSE student specialising in AI/ML and a MERN stack developer.</p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <div class="chips">
        <span>HTML</span><span>CSS</span><span>JavaScript</span>
        <span>React</span><span>Node.js</span><span>MongoDB</span
        ><span>Python</span>
      </div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="projectList" class="grid"></div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contactForm">
        <input type="text" placeholder="Your name" required />
        <input type="email" placeholder="Your email" required />
        <textarea rows="4" placeholder="Message" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <footer>© 2026 Vivek</footer>
    <script src="script.js"></script>
  </body>
</html>
